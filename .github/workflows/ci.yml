name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No-secrets gate
        run: ./scripts/check-secrets.sh --all

  test:
    needs: secrets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
        env:
          CGO_ENABLED: "1"
      - name: Build (pure Go)
        run: go build ./cmd/muninn
        env:
          CGO_ENABLED: "0"
      - name: jcode multi-instance e2e (keyword-only)
        if: runner.os != 'Windows'
        run: ./scripts/jcode-instances-e2e.sh
        env:
          MUNINN_NO_EMBED: "1"
